<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>To-Do Project</title>
    <style>
        button {
            cursor: pointer;
        }

        .delBtn {
            opacity: 60%;
            font-size: 1.125rem;
            margin-left: 20px;
        }

        .delBtn:hover {
            opacity: 100%;
        }

        @media screen and (max-width: 375px) {
            #taskInput {
                width: 13rem;
            }
        }
    </style>
</head>
<body class="bg-blend-color-dodge h-screen flex justify-center text-text font-sans ">
    <div id="container">
        <h1 class="text-4xl font-semibold text-center my-8 ">To-Do List</h1>

        <!-- INPUT FIELD -->
        <div class="flex ">
        <input class="w-72 border rounded px-2 py-1 bg-[#e6a52e]/70 transition-all-2s-ease-in hover:bg-[#e6a52e] focus:text-white" type="text" id="taskInput" placeholder="Enter a new task">
        <button class="ml-3 text-accent/80 text-lg hover:text-accent" id="addTaskBtn">+ Add Task</button>
        </div>

        <!-- TASK CONTAINER -->
        <ol class="list-decimal my-8 text-lg space-y-2" id="taskContainer">
        </ol>
    </div>
</body>
<script src="script.js"></script>
</html>
